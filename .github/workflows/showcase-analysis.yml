name: Showcase analysis
on:
  pull_request:
    paths: ["showcase/**", ".github/workflows/showcase-analysis.yml"]
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [appointment-operations, engine-prognostics, grid-forecast, video-signal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: showcase/requirements.txt
      - run: pip install -r showcase/requirements.txt
      - run: python showcase/${{ matrix.project }}/pipeline.py
        env:
          OMP_NUM_THREADS: "4"
      - run: python -m pytest showcase/${{ matrix.project }} -q
      - run: jupyter nbconvert --execute --to notebook --inplace showcase/${{ matrix.project }}/analysis.ipynb
        env:
          OMP_NUM_THREADS: "4"
  commissioning:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase/commissioning-readiness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: showcase/commissioning-readiness/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
